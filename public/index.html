<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Westpac — Bereavement Support</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col items-center justify-center p-4">
  <div class="w-full max-w-lg bg-white rounded-2xl shadow-lg flex flex-col" style="height:90vh">

    <div class="bg-red-700 text-white rounded-t-2xl px-6 py-4">
      <h1 class="text-lg font-semibold">Westpac Bereavement Support</h1>
      <p id="session-label" class="text-sm text-red-200">We're here to help you through this</p>
    </div>

    <div id="chat" class="flex-1 overflow-y-auto p-4 space-y-3"></div>

    <div class="border-t p-4 flex gap-2">
      <input id="input" type="text"
        placeholder="Type your message..."
        class="flex-1 border rounded-xl px-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-red-600"
        onkeydown="if(event.key==='Enter') sendMessage()" />
      <button onclick="sendMessage()"
        class="bg-red-700 text-white px-4 py-2 rounded-xl text-sm font-medium hover:bg-red-800">
        Send
      </button>
    </div>
  </div>

  <script>
    const sessionId = 'WBC-' + Math.random().toString(36).substr(2,5).toUpperCase();
    document.getElementById('session-label').textContent = 'Session: ' + sessionId + ' — save this to return later';

    window.onload = () => addMessage('bot', "Hello, I'm here to help you through the process of managing a loved one's Westpac accounts. I'm so sorry for your loss. Whenever you're ready, could you tell me the full name of the person who has passed away?");

    function addMessage(sender, text) {
      const chat = document.getElementById('chat');
      const div = document.createElement('div');
      div.className = sender === 'bot'
        ? 'bg-gray-100 text-gray-800 rounded-2xl rounded-tl-none px-4 py-3 text-sm max-w-xs'
        : 'bg-red-700 text-white rounded-2xl rounded-tr-none px-4 py-3 text-sm max-w-xs ml-auto';
      div.textContent = text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    function addTyping() {
      const div = document.createElement('div');
      div.id = 'typing';
      div.className = 'bg-gray-100 text-gray-400 rounded-2xl rounded-tl-none px-4 py-3 text-sm max-w-xs italic';
      div.textContent = 'typing...';
      document.getElementById('chat').appendChild(div);
    }

    async function sendMessage() {
      const input = document.getElementById('input');
      const message = input.value.trim();
      if (!message) return;
      addMessage('user', message);
      input.value = '';
      addTyping();
      try {
        const res = await fetch('/chat', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({sessionId, message})
        });
        const data = await res.json();
        document.getElementById('typing')?.remove();
        addMessage('bot', data.reply);
      } catch(err) {
        document.getElementById('typing')?.remove();
        addMessage('bot', 'Sorry, something went wrong. Please try again.');
      }
    }
  </script>
</body>
</html>
