<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Grief Banking Assistant</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center p-4">
  <form method="POST" action="{{ url_for('admin_login') }}"
        class="w-full max-w-sm bg-white rounded-2xl shadow-lg p-8 space-y-5">
    <div class="bg-red-700 text-white rounded-xl px-6 py-4 text-center">
      <h1 class="text-lg font-semibold">Admin Sign In</h1>
      <p class="text-sm text-red-200">Grief Banking Assistant</p>
    </div>
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <div class="text-sm text-red-700 bg-red-50 rounded-lg px-3 py-2">
          {{ messages[0] }}
        </div>
      {% endif %}
    {% endwith %}
    <input type="password" name="password" placeholder="Admin password" autofocus
      class="w-full border rounded-xl px-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-red-600" />
    <button type="submit"
      class="w-full bg-red-700 text-white py-3 rounded-xl font-medium hover:bg-red-800">
      Sign in
    </button>
  </form>
</body>
</html>
